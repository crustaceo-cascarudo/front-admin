<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fs-4">Gestión de Categorías</h2>
            <mat-paginator (page)="handlePageEvent($event)" [length]="pageContent.totalElements" [pageSize]="10"
                [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page">
            </mat-paginator>
        </div>
        <button class="btn btn-success" (click)="handleCreate()">
            <i class="bi bi-plus-circle me-2"></i>Agregar Categoría
        </button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Nombre</th>
                            <th scope="col">Slug</th>
                            <th scope="col">Descripción</th>
                            <th scope="col">Estado</th>
                            <th scope="col" class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        @for (category of categories; track category.id) {
                        <tr>
                            <td>{{ category.id }}</td>
                            <td><button class="link-button" (click)="handleEdit(category)">{{ category.name }}</button></td>
                            <td><span class="badge bg-secondary">{{ category.slug }}</span></td>
                            <td>{{ category.description || 'Sin descripción' }}</td>
                            <td>
                                @if (category.estado) {
                                <span class="badge bg-success">Activo</span>
                                } @else {
                                <span class="badge bg-danger">Inactivo</span>
                                }
                            </td>
                            <td class="text-center">
                                <div class="btn-group" role="group">
                                    <button class="btn btn-outline-danger" (click)="handleDelete(category.id)"
                                        title="Eliminar">
                                        <i class="bi bi-trash"></i>
                                        🗑</button>
                                </div>
                            </td>
                        </tr>
                        } @empty {
                        <tr>
                            <td colspan="6" class="text-center text-muted py-4">
                                <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                                No hay categorías disponibles
                            </td>
                        </tr>
                        }
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
