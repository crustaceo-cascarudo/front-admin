<div class="w-100 h-100 p-5 d-flex flex-column justify-content-start">
    <h2 class="mb-4 fs-4">Articulos &nbsp;|&nbsp; Pagina: {{page.pageNumber}} Elementos: {{page.pageSize}}
    </h2>
    <div class="d-flex row row-cols-auto g-3 justify-content-around align-content-center">
        @for(i of ingredients; track i.id){
        <div class="d-flex justify-content-center">
            <card-ingredient (update)="getData()" [ingredient]="i"></card-ingredient>
        </div>
        }
    </div>
</div>
