<div class="w-100 h-100 p-5 d-flex flex-column justify-content-start">
    <div class="d-flex flex-row justify-content-between align-items-center mb-4">
        <h2 class="fs-4">Articulos</h2>
        <mat-paginator (page)="handlePageEvent($event)"  [length]="pageContent.totalElements" [pageSize]="10" [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page">
        </mat-paginator>
        <button class="btn btn-primary" (click)="openCreateModal()">
            Añadir nuevo producto
        </button>
    </div>
    <div class="d-flex row row-cols-auto g-3 justify-content-around align-content-center">
        @for(p of products; track p.id){
            <div class="d-flex justify-content-center">
                <card-product (update)="getData()" [product]="p"></card-product>
            </div>
        }
    </div>
</div>
