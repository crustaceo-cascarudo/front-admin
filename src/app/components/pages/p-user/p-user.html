<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-people-fill me-2"></i>Gestión de Usuarios</h2>
        <button class="btn btn-success" (click)="handleCreate()">
            <i class="bi bi-person-plus-fill me-2"></i>Agregar Administrador
        </button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="mb-3">
                <label for="roleFilter" class="form-label fw-bold">
                    <i class="bi bi-funnel-fill me-2"></i>Filtrar por Rol:
                </label>
                <select id="roleFilter" class="form-select" [(ngModel)]="selectedRole" (change)="onRoleFilterChange()">
                    <option value="TODOS">Todos</option>
                    <option [value]="userRole.ADMIN">Administradores</option>
                    <option [value]="userRole.NORMAL">Normales</option>
                </select>
            </div>

            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Nombre</th>
                            <th scope="col">Rol</th>
                            <th scope="col" class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        @for (user of filteredUsers; track user.id) {
                        <tr>
                            <td>{{ user.id }}</td>
                            <td>
                                <i class="bi bi-person-circle me-2"></i>{{ user.name }}
                            </td>
                            <td>
                                @if (user.role === 'ADMIN') {
                                <span class="badge bg-danger">
                                    <i class="bi bi-shield-fill-check me-1"></i>ADMIN
                                </span>
                                } @else {
                                <span class="badge bg-secondary">
                                    <i class="bi bi-person-fill me-1"></i>CLIENTE
                                </span>
                                }
                            </td>
                            <td class="text-center">
                                <div class="btn-group" role="group">
                                    @if (user.role === 'ADMIN') {
                                    <button class="btn btn-sm btn-outline-danger" (click)="handleDelete(user.id)"
                                        title="Eliminar">
                                        <i class="bi bi-trash"></i>
                                        Eliminar
                                    </button>
                                    } @else {
                                    
                                    }
                                </div>
                            </td>
                        </tr>
                        } @empty {
                        <tr>
                            <td colspan="4" class="text-center text-muted py-4">
                                <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                                No hay usuarios disponibles
                            </td>
                        </tr>
                        }
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
